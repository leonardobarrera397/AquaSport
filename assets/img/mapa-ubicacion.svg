<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <!-- Fondo del mapa -->
  <rect x="0" y="0" width="800" height="350" fill="#E9F5F9"/>

  <!-- Calles del mapa (lineas simples) -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="0" y1="220" x2="800" y2="220" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="150" y1="0" x2="150" y2="350" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="500" y1="0" x2="500" y2="350" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="650" y1="0" x2="650" y2="350" stroke="#FFFFFF" stroke-width="10"/>

  <!-- Manzanas / terrenos -->
  <rect x="20" y="20" width="100" height="40" fill="#D8F3DC"/>
  <rect x="200" y="20" width="270" height="40" fill="#D8F3DC"/>
  <rect x="550" y="20" width="80" height="40" fill="#D8F3DC"/>
  <rect x="20" y="240" width="100" height="90" fill="#D8F3DC"/>
  <rect x="200" y="240" width="270" height="90" fill="#D8F3DC"/>

  <!-- Ubicacion del club -->
  <rect x="320" y="110" width="90" height="70" fill="#0096C7" stroke="#023E8A" stroke-width="3"/>

  <!-- Marcador / pin de ubicacion -->
  <g transform="translate(365,90)">
    <path d="M0 0 C -22 0, -22 -40, 0 -40 C 22 -40, 22 0, 0 0 Z" fill="#D90429"/>
    <circle cx="0" cy="-26" r="9" fill="#FFFFFF"/>
  </g>

  <text x="400" y="200" font-family="Arial, sans-serif" font-size="16" fill="#023E8A" text-anchor="middle">Club AquaSport</text>
</svg>
